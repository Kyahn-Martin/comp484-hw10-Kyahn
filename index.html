<!DOCTYPE html>
<html>
  <head>
    <title>Your Giga Pet</title>
    <meta name="description" content="A cool thing made with Glitch">
    <link id="favicon" rel="icon" href="https://glitch.com/edit/favicon-app.ico" type="image/x-icon">
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>
        This is your Giga Pet
      </h1>
    </header>

    <main>
      <section class="pet-image-container">
         <!-- Replace pet image with your own pet image -->
        <img class="pet-image" src="images/happy_dog.jpg">
      </section>
      <section class="dashboard">
        <div id="notification">.</div>
        <div>Name: <strong><span class="name"></span></strong></div>
        <div>Weight: <strong><span class="weight"></span> pounds</strong></div>
        <div>Happiness: <strong><span class="happiness"></span> tail wags (per min)</strong></div>
        <div class="toys-section">Toys: <strong><span class="toys"></span> different toys</div>
        <div>Age: <strong><span class="age"></span></strong> years</div>
        <!-- Add an audio element that will play a sound effect when the pet becomes too sad or dies -->
        <audio id="audio" src="audio/sad_dog.wav"></audio>
        <audio id="audio1" src="audio/bell.mp3"></audio>
        <div class="button-container">
          <button class="treat-button">
            Treat
          </button>
          <button class="play-button">
            Play
          </button>
          <button class="exercise-button">
            Exercise
          </button>
          <!-- Added a toy button -->
          <button class = "toy-button">
            Give toy
          </button>
          <button id="violation">
            Cause Violation
          </button>
          <div>How old will your pet be after some years?
          <input type="text" id="futureAgeInput">
          </div>
        </div>
        
      </section>
    </main>

    <!-- Your web-app is https, so your scripts need to be too -->
    <script src="https://code.jquery.com/jquery-2.2.1.min.js"
            integrity="sha256-gvQgAFzTH6trSrAWoH1iPo9Xc96QxSZ3feW6kem+O00="
            crossorigin="anonymous"></script>
  </body>
</html>
